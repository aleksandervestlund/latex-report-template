name: Build PDF

on:
  # push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    container: texlive/texlive:latest
    timeout-minutes: 15
    outputs:
      pdf: ${{ steps.name.outputs.pdf }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Compile main.tex
        run: latexmk -pdf -interaction=nonstopmode -file-line-error -halt-on-error main.tex

      - name: Name the PDF after the commit
        id: name
        run: |
          pdf="latex-project-template-${GITHUB_SHA::7}.pdf"
          cp main.pdf "$pdf"
          echo "pdf=$pdf" >> "$GITHUB_OUTPUT"

      - name: Upload the PDF
        uses: actions/upload-artifact@v7
        with:
          path: ${{ steps.name.outputs.pdf }}
          archive: false
          if-no-files-found: error
          retention-days: 30

  publish:
    needs: build
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    env:
      GH_REPO: ${{ github.repository }}
      GH_TOKEN: ${{ github.token }}
      PDF: ${{ needs.build.outputs.pdf }}
    steps:
      - name: Download the PDF
        uses: actions/download-artifact@v8
        with:
          name: ${{ needs.build.outputs.pdf }}

      - name: Update the "Latest PDF" release
        run: |
          mv "$PDF" latex-project-template.pdf
          notes="Built from $GITHUB_SHA."
          if gh release view pdf > /dev/null 2>&1; then
            gh api --method PATCH "repos/$GITHUB_REPOSITORY/git/refs/tags/pdf" -f sha="$GITHUB_SHA" -F force=true > /dev/null
            gh release upload pdf latex-project-template.pdf --clobber
            gh release edit pdf --notes "$notes"
          else
            gh release create pdf latex-project-template.pdf --target "$GITHUB_SHA" --title "Latest PDF" --notes "$notes"
          fi
